<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCC Editing Style Menu</title>
<link rel="icon" href="/logo.png">
<style>
  @font-face { font-family: "Montserrat"; src: url("/fonts/Montserrat-Variable.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Inter"; src: url("/fonts/Inter-Light.ttf"); font-weight: 300; }
  @font-face { font-family: "Inter"; src: url("/fonts/Inter-SemiBold.ttf"); font-weight: 600; }
  @font-face { font-family: "Inter"; src: url("/fonts/Inter-Bold.ttf"); font-weight: 700; }

  :root {
    --bg: #000; --panel: #06080D; --panel-2: #0B0F18; --line: rgba(255,255,255,.08);
    --blue: #0066FF; --blue-hi: #3D8BFF; --blue-line: rgba(0,102,255,.38); --blue-glow: rgba(0,102,255,.20);
    --text: #FFFFFF; --muted: #8C95A8; --dim: #5B6275;
    --head: "Montserrat", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 400 15px/1.55 "Inter", system-ui, sans-serif;
    background:
      radial-gradient(900px 420px at 50% -120px, rgba(0,102,255,.28), transparent 70%),
      radial-gradient(600px 300px at 85% 110%, rgba(0,102,255,.10), transparent 70%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 48px 16px 64px; }

  header { text-align: center; max-width: 720px; margin: 0 auto 40px; }
  .brandrow { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .brandrow img { width: 34px; height: auto; filter: drop-shadow(0 0 14px rgba(0,102,255,.55)); }
  .eyebrow { font: 800 12px/1 var(--head); letter-spacing: .22em; text-transform: uppercase; color: var(--text); }
  h1 { font: 800 clamp(32px, 6vw, 52px)/1.06 var(--head); letter-spacing: -0.025em; margin: 0 0 16px; }
  h1 .b { color: var(--blue-hi); text-shadow: 0 0 32px rgba(0,102,255,.55); }
  .lede { color: var(--muted); font-size: 16.5px; margin: 0 auto; max-width: 560px; }
  .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; padding: 8px 14px 8px 12px;
    border: 1px solid var(--blue-line); border-radius: 999px; background: rgba(0,102,255,.07); color: #C9D6F0; font-size: 13px; }
  .status b { color: #fff; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue-hi); box-shadow: 0 0 0 0 rgba(61,139,255,.7); animation: pulse 1.8s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(61,139,255,0); } 100% { box-shadow: 0 0 0 0 rgba(61,139,255,0); } }

  .label { font: 800 12px/1 var(--head); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 16px 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }

  .card { position: relative; display: flex; flex-direction: column; border-radius: 22px; overflow: hidden;
    background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line);
    color: inherit; text-decoration: none; transition: transform .2s ease, border-color .2s, box-shadow .2s; }
  a.card { border-color: var(--blue-line); box-shadow: 0 0 28px var(--blue-glow); }
  a.card:hover, a.card:focus-visible { transform: translateY(-4px); border-color: var(--blue); box-shadow: 0 0 46px rgba(0,102,255,.38); outline: none; }
  .media { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: #05070C; }
  .media video, .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,15,24,0) 58%, rgba(11,15,24,1)); }
  .pill { position: absolute; z-index: 2; top: 14px; left: 14px; font: 800 10.5px/1 var(--head); letter-spacing: .16em;
    text-transform: uppercase; padding: 8px 11px; border-radius: 999px; }
  .pill.ready { background: var(--blue); color: #fff; box-shadow: 0 0 18px rgba(0,102,255,.7); }
  .pill.soon { background: rgba(0,0,0,.55); color: #C9D6F0; border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(6px); }

  .body { padding: 6px 22px 22px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .body h2 { font: 800 23px/1.15 var(--head); letter-spacing: -0.015em; margin: 0; }
  .body p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { font: 600 12px/1 "Inter"; color: #D5DEF0; padding: 7px 10px; border-radius: 8px; background: rgba(0,102,255,.10); border: 1px solid rgba(0,102,255,.22); }
  .cta { margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 13px;
    font: 800 15px/1 var(--head); letter-spacing: .01em; }
  a.card .cta { background: var(--blue); color: #fff; }
  a.card:hover .cta .arr { transform: translateX(4px); }
  .arr { transition: transform .2s; }

  /* Coming soon */
  .card.soon { opacity: .92; }
  .card.soon .body h2 { color: #DCE3F2; }
  .card.soon .cta { border: 1px dashed rgba(255,255,255,.16); color: var(--dim); }
  .soonart { position: absolute; inset: 0;
    background:
      radial-gradient(220px 220px at 50% 42%, rgba(0,102,255,.38), transparent 70%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 28px 28px,
      #04060B; }
  .soonart .ph { position: absolute; left: 50%; top: 42%; width: 34%; aspect-ratio: 9 / 16; transform: translate(-50%, -50%) rotate(-6deg);
    border-radius: 16px; border: 1.5px solid rgba(61,139,255,.55); background: rgba(0,102,255,.06);
    box-shadow: 0 0 40px rgba(0,102,255,.35), inset 0 0 30px rgba(0,102,255,.15); animation: float 6s ease-in-out infinite; }
  .soonart .ph::before { content: ""; position: absolute; left: 50%; top: 50%; width: 30%; aspect-ratio: 1; transform: translate(-40%, -50%);
    background: url("/logo.png") center / contain no-repeat; opacity: .85; filter: drop-shadow(0 0 10px rgba(0,102,255,.8)); }
  .soonart .ph.back { transform: translate(-22%, -54%) rotate(8deg); opacity: .35; animation-delay: -3s; }
  .soonart .ph.back::before { display: none; }
  @keyframes float { 50% { margin-top: -8px; } }
  @media (prefers-reduced-motion: reduce) { .soonart .ph, .dot { animation: none; } }

  footer { margin-top: 44px; text-align: center; color: var(--dim); font-size: 13.5px; }
  footer b { color: var(--muted); font-weight: 600; }
  footer .howbtn { margin-left: 8px; }
  /* Izbor formata (PLAN §14, faza 4): dva pitanja → preporuka */
  .chooser { margin: 0 0 22px; border: 1px solid rgba(0,102,255,.38); border-radius: 18px; padding: 18px 20px; background: linear-gradient(180deg, #0D111A, #06080D); }
  .chooser[hidden] { display: none; }
  .chooser h3 { margin: 0 0 4px; font: 800 17px/1.3 var(--head); color: #fff; }
  .chooser .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .chooser .yn { display: flex; gap: 10px; flex-wrap: wrap; }
  .chooser .yn button, .chooser .go { border-radius: 12px; padding: 11px 20px; font: 700 14.5px/1 var(--head); cursor: pointer; }
  .chooser .yn button { background: #0B0F18; border: 1px solid rgba(255,255,255,.14); color: #fff; }
  .chooser .yn button:hover, .chooser .yn button:focus-visible { border-color: #0066FF; box-shadow: 0 0 14px rgba(0,102,255,.35); outline: none; }
  .chooser .res { color: #DCE6FA; font-size: 15px; margin: 0 0 14px; }
  .chooser .res b { color: #fff; }
  .chooser .go { display: inline-block; text-decoration: none; background: #0066FF; color: #fff; border: 0; box-shadow: 0 0 20px rgba(0,102,255,.5); }
  .chooser .again { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: 600 13.5px/1 "Inter"; margin-left: 14px; }
  .card.picked { outline: 3px solid #3D8BFF; outline-offset: 3px; }
  .err { text-align: center; color: var(--muted); padding: 40px; }
  .howbtn { background: transparent; border: 1px solid rgba(0,102,255,.38); color: #DCE6FA; border-radius: 999px; padding: 8px 14px;
    font: 700 13px/1 "Montserrat", "Inter", sans-serif; cursor: pointer; }
  .howbtn:hover, .howbtn:focus-visible { border-color: #0066FF; color: #fff; box-shadow: 0 0 16px rgba(0,102,255,.4); outline: none; }
</style>
<script src="/assets/tour.js"></script>
<script src="/assets/faq.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandrow"><img src="/logo.png" alt=""><span class="eyebrow">Create Content Club</span></div>
    <h1>Choose your <span class="b">editing style</span></h1>
    <p class="lede">Pick a format for this video. Each one has its own look and options. You'll choose the details on the next screen.</p>
    <div class="status" id="status" hidden><span class="dot"></span><span>Preparing <b id="vname"></b> in the background</span></div>
    <div style="margin-top:14px"><button type="button" class="howbtn" id="howBtn">How does this work?</button></div>
  </header>

  <div class="label" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">Formats
    <button type="button" class="howbtn" id="chooseBtn" aria-expanded="false" aria-controls="chooser" hidden>Which format is right for me?</button></div>
  <div class="chooser" id="chooser" hidden aria-live="polite"></div>
  <div class="grid" id="grid"></div>

  <footer>Questions? <b>Message us in your 1-on-1 chat on Discord.</b> <button type="button" class="howbtn" id="faqBtn">Read the FAQ</button></footer>
</div>

<script>
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function readyCard(f) {
  const a = document.createElement("a");
  a.className = "card"; a.href = "/f/" + encodeURIComponent(f.id);
  a.setAttribute("aria-label", `${f.title}: ${f.tagline}`);
  a.innerHTML = `
    <div class="media">
      <video src="/assets/formats/${esc(f.id)}.mp4" poster="/assets/formats/${esc(f.id)}.jpg" muted loop playsinline autoplay aria-hidden="true"></video>
      <span class="pill ready">Available</span>
    </div>
    <div class="body">
      <h2>${esc(f.title)}</h2>
      <p>${esc(f.tagline)}</p>
      ${f.includes.length ? `<div class="chips">${f.includes.map(i => `<span class="chip">${esc(i)}</span>`).join("")}</div>` : ""}
      <div class="cta">Choose ${esc(f.title)} <span class="arr">→</span></div>
    </div>`;
  return a;
}

function soonCard(f) {
  const d = document.createElement("div");
  d.className = "card soon"; d.setAttribute("aria-disabled", "true");
  d.innerHTML = `
    <div class="media"><div class="soonart"><div class="ph back"></div><div class="ph"></div></div><span class="pill soon">Coming soon</span></div>
    <div class="body">
      <h2>${esc(f.title)}</h2>
      <p>${esc(f.tagline)}</p>
      <div class="cta">Coming soon</div>
    </div>`;
  return d;
}

// Izbor formata: dva pitanja → preporuka + dugme za taj format (samo kad su oba formata dostupna)
async function setupChooser(fmts) {
  const ready = fmts.filter(f => f.status === "ready").map(f => f.id);
  if (!(ready.includes("basic") && ready.includes("split-screen"))) return;
  let C = null;
  try { const r = await fetch("/assets/help.json"); if (r.ok) C = (await r.json()).chooser; } catch (e) {}
  if (!C) return;
  const btn = document.getElementById("chooseBtn"), box = document.getElementById("chooser");
  btn.hidden = false; btn.textContent = C.title;
  const title = (id) => (fmts.find(f => f.id === id) || {}).title || id;
  const result = (id) => {
    document.querySelectorAll("#grid .card").forEach(c => c.classList.remove("picked"));
    const card = document.querySelector(`#grid a[href$="${id}"]`);
    if (card) card.classList.add("picked");
    box.innerHTML = `<h3>We recommend ${esc(title(id))}</h3><p class="res">${esc(C.results[id] || "")}</p>
      <a class="go" href="/f/${encodeURIComponent(id)}">Choose ${esc(title(id))}</a><button type="button" class="again">Start over</button>`;
    box.querySelector(".again").onclick = () => ask(0);
    box.querySelector(".go").focus();
  };
  const ask = (i) => {
    document.querySelectorAll("#grid .card").forEach(c => c.classList.remove("picked"));
    const q = C.questions[i];
    box.innerHTML = `<h3>${esc(q.q)}</h3><p class="hint">${esc(q.hint)}</p>
      <div class="yn"><button type="button" data-a="yes">Yes</button><button type="button" data-a="no">No</button></div>`;
    box.querySelector('[data-a="yes"]').onclick = () => result("split-screen");
    box.querySelector('[data-a="no"]').onclick = () => (i + 1 < C.questions.length ? ask(i + 1) : result("basic"));
    box.querySelector('[data-a="yes"]').focus();
  };
  btn.onclick = () => {
    const opening = box.hidden;
    box.hidden = !opening; btn.setAttribute("aria-expanded", String(opening));
    if (opening) ask(0); else document.querySelectorAll("#grid .card").forEach(c => c.classList.remove("picked"));
  };
}
document.getElementById("faqBtn").onclick = (e) => window.CCCFaq && CCCFaq.show(e.currentTarget);

(async () => {
  const grid = document.getElementById("grid");
  try {
    const m = await (await fetch("/api/menu")).json();
    if (m.video) { document.getElementById("vname").textContent = `“${m.video}”`; document.getElementById("status").hidden = false; }
    m.formats.forEach(f => grid.appendChild(f.status === "ready" ? readyCard(f) : soonCard(f)));
    // vodič (PLAN §14, faza 3): sam prvi put, posle na dugme
    const ids = m.formats.filter(f => f.status === "ready").map(f => f.id);
    const steps = [
      { el: "#grid", title: "Pick a format", text: "Each format makes a different kind of video. Click the one you want. You choose the details on the next screen." },
      ...(ids.includes("split-screen") ? [{ el: () => document.querySelector('#grid a[href$="split-screen"]'), title: "Not sure which one?",
        text: "Basic Edit works for any talking video. Split Screen is great when you talk about apps, brands, news or results you could show above you." }] : []),
      { el: "#status", title: "Already working", text: "Your video is being prepared in the background while you choose, so nothing is wasted." },
    ];
    const go = (force) => window.CCCTour && (force ? CCCTour.start("tour_menu", steps, { returnFocus: document.getElementById("howBtn") }) : CCCTour.auto("tour_menu", steps));
    document.getElementById("howBtn").onclick = () => go(true);
    go(false);
    setupChooser(m.formats);
  } catch (e) {
    grid.outerHTML = `<p class="err">The editor stopped waiting for your choice. Go back to Claude Code and ask it to open the style menu again.</p>`;
  }
})();
</script>
<script>
/* Meni zna da je zatvoren (QA 0.8.0, P1-30): server se gasi posle roka ili izbora — stranica to proveri na 5 s
   i pokaže jasnu poruku umesto dugmeta koje "ne radi". */
(function () {
  const show = () => {
    if (window.cccDone || document.getElementById("ccc-closed")) return;
    const d = document.createElement("div");
    d.id = "ccc-closed";
    d.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(10,10,11,.9);display:grid;place-items:center;" +
      "color:#fff;font:600 20px/1.45 system-ui,sans-serif;text-align:center;padding:24px";
    d.innerHTML = "<div><p style='font-size:30px;margin:0 0 12px'>This menu has closed</p>" +
      "<p style='opacity:.8;margin:0;max-width:520px'>Go back to Claude Code and say \u201copen the style menu again\u201d, " +
      "or just answer the questions there.</p></div>";
    document.body.appendChild(d);
  };
  window.cccClosed = show;
  let fails = 0;
  setInterval(() => {
    if (window.cccDone) return;
    fetch("/api/ping", {cache: "no-store"}).then((r) => { fails = r.ok ? 0 : fails + 1; if (fails >= 2) show(); })
      .catch(() => { if (++fails >= 2) show(); });
  }, 5000);
})();
</script>
</body>
</html>
